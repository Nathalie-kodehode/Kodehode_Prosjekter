<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="craft-images/craftsvilla-logo.svg" />
    <link rel="stylesheet" href="community.style.css">
    <title>Community</title>
</head>
<body>
     <!-- HEADER -->
    <header>
      <section class="header">
        <!-- Logo -->
        <section class="logo">
          <button class="logo-button">
            <a href="landing-index.html">
              <img
                src="craft-images/craftsvilla-logo.svg"
                alt="the logo for craftsvilla"
              />
            </a>
          </button>
        </section>
        <!-- Searchbar & 3 Buttons -->
        <section class="header-box">
          <div class="searchbar h3-search">
            <img src="craft-images/searchbar.svg" alt="magnyfying glass" />
            <h3>Search...</h3>
          </div>
          <!-- Sign Up -->
          <div>
            <button class="header-button">
              <img src="craft-images/login.svg" alt="icon for signup" />
              <a href="./signup.index.html">
                <h3 class="h3-button">Sign Up</h3>
              </a>
            </button>
          </div>
          <!-- Community -->
          <div>
            <button class="header-button">
              <img src="craft-images/community.svg" alt="icon for community" />

                <h3 class="h3-button">Community</h3>
              </a>
            </button>
          </div>
          <!-- Feedback -->
          <div>
            <button class="header-button">
              <img src="craft-images/feedback.svg" alt="icon for feedback" />
              <a href="./feedback-index.html">
                <h3 class="h3-button">Feedback</h3>
              </a>
            </button>
          </div>
        </section>
      </section>
    </header>
    <main>
<section class="community-container">
        <section class="com-title">
            <h2> Post of the Day</h2>
        </section>
        <section class="post-box">

           <div class="user-img"> 
  <img class="post-img"

          alt="a user's image post"/>
            </div>
           
            <section class="post-content">
<div>

</div>
<section class="description">

        My grandson came to visit my workshop today!

    </p>
    </div>
    <div class="hashtags">
   <div> 
<p class="p-hash">#pottery</p>
   </div>
      <div> 
<p class="p-hash">#grandson</p>
   </div>
   <div> 
<p class="p-hash">#family</p>

   <div>

   </div>


    </div>
</section>
<div>

    
</div>

            </section>

        </section>

 <section class="footer footer-text">
