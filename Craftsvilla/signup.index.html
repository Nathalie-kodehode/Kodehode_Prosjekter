<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" href="craft-images/craftsvilla-logo.svg" />
     <link rel="stylesheet" href="signup.style.css">
    <title>Sign Up</title>
</head>
<body>
     <!-- HEADER -->
    <header>
      <section class="header">
        <!-- Logo -->
        <section class="logo">
          <button class="logo-button">
            <a href="landing-index.html">
              <img
                src="craft-images/craftsvilla-logo.svg"
                alt="the logo for craftsvilla"
              />
            </a>
          </button>
        </section>
        <!-- Searchbar & 3 Buttons -->
        <section class="header-box">
          <div class="searchbar h3-search">
            <img src="craft-images/searchbar.svg" alt="magnyfying glass" />
            <h3>Search...</h3>
          </div>
          <!-- Sign Up -->
          <div>
            <button class="header-button">
              <img src="craft-images/login.svg" alt="icon for signup" />
              <a href="./signup.index.html">
                <h3 class="h3-button">Sign Up</h3>
              </a>
            </button>
          </div>
          <!-- Community -->
          <div>
            <button class="header-button">
              <img src="craft-images/community.svg" alt="icon for community" />
              <a href="./community-index.html">
                <h3 class="h3-button">Community</h3>
              </a>
            </button>
          </div>
          <!-- Feedback -->
          <div>
            <button class="header-button">
              <img src="craft-images/feedback.svg" alt="icon for feedback" />
              <a href="./feedback-index.html">
                <h3 class="h3-button">Feedback</h3>
              </a>
            </button>
          </div>
        </section>
      </section>
    </header>
    <main>
<section class="signup-form">
    
<form action="">
    <!-- Title and subtitle -->
    <section class="form-head"> 
    <h2 class="form-title h2-orange"> Join CRAFTSVILLA today!</h2>
    <p class="p-form">Share your art, relax after a long day and converse with over 120 000 people from all walks of life. Register today for free! </p>
    </section>
<!-- Firstname and Lastname -->
    <section class="form-field multi-input">
        <div class="form-div"> 
      <label for="text">First Name</label>
        <input type="text" id="text" placeholder="Text here..."/>
        </div>
    
 <div class="form-div"> 
        <label for="email">Last Name</label>
        <input type="text" id="text" placeholder="Text here...">
        </div>
 
        </section>
        <!-- Age -->
        <section class="form-field">
            <div class="form-div">
        <label for="date">Date of Birth</label>
<input type="date" id="date">
</div>
</section>
<!-- Email -->
    <section class="form-one">
            <div class="form-div">
        <label for="email">Email</label>
<input type="email" id="email" placeholder="Text here...">
</div>
</section>

<!-- Phone -->
    <section class="form-one">
            <div class="form-div">
        <label for="tel">Phone Number</label>
<input type="tel" id="tel" placeholder="1234...">
</div>
</section>

<!-- Password 2 Fields -->
    <section class="form-field multi-input">
        <div class="form-div"> 
      <label for="password">Password</label>
        <input type="password" id="password" placeholder="Text here..."/>
        </div>
    
 <div class="form-div"> 
        <label for="password">Confirm Password</label>
        <input type="password" id="password" placeholder="Text here...">
        </div>
 
        </section>

</form>


</section>



    </main>
     <!-- FOOTER -->
    <footer>
      <section class="footer footer-text">
        <div><h4>About Us</h4></div>
        <div><h4>Projects</h4></div>
        <div><h4>Contact Us</h4></div>
        <div><h4>Terms & Conditions</h4></div>
      </section>
    </footer>
    
</body>
</html>
