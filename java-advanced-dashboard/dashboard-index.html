<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="dashboard-script.js" defer></script>
    <link rel="stylesheet" href="dashboard-style.css">
    <title>Personal Data Dashboard</title>
</head>
<body>
    <main> 
        <div id="headings">
    <h1>Welcome to the Bookworm Library
    </h1>
    <hr></hr>
    <h2>Explore our catalog today - it contains over 10,000 books!</h2>
    </div>
    <form>
        <div class="book-search" id="book-search">
       <label for="text"> <h3>Enter bookID below</h3></label>
        <input type="text" id="book-input" placeholder="example: AC1339">
        <div id="buttons">
        <button type="submit" id="submit-button">Find book</button>
        <button id="add-book">Add book to Favourites</button>
        <button id="remove-button">Remove book</button>
        </div>
        </div>
        <div class="book-toggle" id="book-toggle"></div>
        
    </form>
    </main>
</body>
</html>
