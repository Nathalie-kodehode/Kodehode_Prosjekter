<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="hamburger-style.css" />
    <script src="hamburger-script.js" defer></script>
    <title>Hamburger Project</title>
  </head>
  <body>
    <!-- Navbar -->
    <header>
      <div class="head-buttons" id="head-buttons">
        <!-- Hamburger Menu -->
        <button class="menu-button" id="menu-button">
          <img src="hamburger-images/hamburger.svg" alt="hamburger meny" />
          <h3>Burger Menu</h3>
<!-- NOTE TO SELF; How do we add the UL/LIs here? -->

        </button>
        <!-- The 4 Other Buttons -->
        <button>
          <img src="hamburger-images/profile.svg" alt="profile icon" />
          <h3>My Account</h3>
        </button>
        <button>
          <img src="hamburger-images/shopping.svg" alt="shopping cart icon" />
          <h3>Shopping Cart</h3>
        </button>
        <button>
          <img src="hamburger-images/contact.svg" alt="contact us icon" />
          <h3>Contact Us</h3>
        </button>
        <button>
          <img src="hamburger-images/donate.svg" alt="donation icon" />
          <h3>Donate Here</h3>
        </button>
      </div>
    </header>
    <!-- Hero Image -->
    <main>
      <div class="hero-image" id="hero-image">
        <h1>Heading</h1>
        <h2>Subheading</h2>
      </div>
    </main>
  </body>
</html>
