<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amarante&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Creepster&family=Metamorphous&family=Shadows+Into+Light+Two&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="oppgåve3-style.css" />
    <title>CSS Advances Oppgåve 3</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <section class="container header">
        <h2>Are you brave enough to shop here?</h2>
        <div class="box buttons-top">
          <button class="button small">
            <h3>Ghost Products</h3>
          </button>
          <button class="button small">
            <h3>Vampire Products</h3>
          </button>
          <button class="button small">
            <h3>Werewolf Products</h3>
          </button>
          <button class="button small">
            <h3>Witch Products</h3>
          </button>
          <button class="button small">
            <h3>Zombie Products</h3>
          </button>
        </div>
      </section>
    </header>
    <!-- MAIN -->
    <main>
      <section class="container main-0">
        <div class="halloween-text">
          <h1>Happy Halloween!</h1>
        </div>
      </section>
      <section class="container main-1">
        <img
          src="oppgåve3-images/SKUMMEL.png"
          class="jumpscare"
          alt="a spooky image of a GHOOOOST"
        />
      </section>
      <section class="container main-2">
        <button class="button big">
          <a
            class="big-2"
            href="https://youtu.be/n_qbGJuxCYY?si=1OP1AFn3LO7kJRLH"
            target="_blank"
          >
            <h3>I'm a SPOOKY button with a SPOOKY link!</h3>
          </a>
        </button>
      </section>
    </main>
    <!-- FOOTER -->
    <footer>
      <section class="container footer">
        <h2>You still here?</h2>
        <div class="box buttons-bottom">
          <button class="button small">
            <h3>About Us</h3>
          </button>
          <button class="button small">
            <h3>Our Social Media</h3>
          </button>
          <button class="button small">
            <h3>FAQ</h3>
          </button>
          <button class="button small">
            <h3>Terms & Conditions</h3>
          </button>
          <button class="button small">
            <h3>Contact Us</h3>
          </button>
        </div>
      </section>
    </footer>
  </body>
</html>
