<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="landing.style.css">
    <title>Craftsvilla Landingpage</title>
</head>
<body>
<header>
<section class="header">
    <section class="logo">
        <img src="craft-images/craftsvilla-logo.svg" alt="the logo for craftsvilla">

    <section class="header-box">
        <div class="searchbar h3-search">
<img src="craft-images/searchbar.svg" alt="magnyfying glass">
<h3> Search...</h3>
        </div>
        <div class="header-button">

        </div>
            <div class="header-button">

        </div>
            <div class="header-button">
<img src="craft-images/feedback.svg" alt="icon for signup">

        </div>
    </section>

</section>


</header>

    <section class="hero-heading">
<div class="h1-black"> <h1> Welcome to</h1> </div>
<div class="h1-red"> <h1> CRAFTSVILLA</h1></div>
    </section>
    <section class="hero-image">
        <img src="craft-images/hero-image.png" alt="the hero image for frontpage">
    </section>

</main>
<footer>
    <section class="footer footer-text">
        <div> <h4>About Us</h4></div>
         <div> <h4>Projects</h4></div>
