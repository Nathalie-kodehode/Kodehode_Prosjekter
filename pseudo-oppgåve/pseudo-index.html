<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="pseudo.style.css" />
    <title>Pseudo Oppgåve</title>
  </head>
  <body>
    <!-- Tittel -->
    <h1>Lær Pseudo-elementer!</h1>
    <p>I denne oppgåva skal vi gå igjennom ulike pseudo-elementer.</p>
    <!-- Liste -->
    <h2>Liste Seksjon</h2>
    <section class="liste">
      <ul class="ul-liste">
        <li><p class="kul-tekst">Den aller BESTE!</p></li>
       <li><p class="kul-tekst">Veldig bra!</p> </li> 
      <li><p class="kul-tekst">Eh, grei nok</p> </li>
    <li><p class="kul-tekst">Veldig dårleg</p> </li>
    <li><p class="kul-tekst">Den aller VERSTE!</p></li>
      </ul>
    </section>
    <!-- Div 1 -->
    <h2>Div Seksjon</h2>
    <section class="container-1">
      <div class="div-1">
        <h3>Kul div 1</h3>
      </div>
      <div class="1">
        <h3>Kul div 2</h3>
      </div>
      <div class="div-1">
        <h3>Kul div 3</h3>
      </div>
    </section>
    <!-- Div 2 -->
    <section class="container-2">
      <div class="div-2">
        <h3>Kul div 1</h3>
      </div>
      <div class="ignore">
        <h3>Kul div 2</h3>
      </div>
      <div class="div-2">
        <h3>Kul div 3</h3>
      </div>
    </section>
    <!-- Knapp -->
    <h2>Knapp</h2>
    <button class="slutt-knapp">
      <a
        href="https://youtu.be/0pn0sscm0e0?si=qCblzxBUo7m9bjyC"
        target="_blank"
      >
        <p>Trykk på meg for julestemning ;)</p>
      </a>
    </button>
  </body>
</html>
