<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="feedback.style.css" />
    <link rel="icon" href="craft-images/craftsvilla-logo.svg" />
    <title>Feedback</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <section class="header">
        <!-- Logo -->
        <section class="logo">
          <button class="logo-button">
            <a href="landing-index.html">
              <img
                src="craft-images/craftsvilla-logo.svg"
                alt="the logo for craftsvilla"
              />
            </a>
          </button>
        </section>
        <!-- Searchbar & 3 Buttons -->
        <section class="header-box">
          <div class="searchbar h3-search">
            <img src="craft-images/searchbar.svg" alt="magnyfying glass" />
            <h3>Search...</h3>
          </div>
          <!-- Sign Up -->
          <div>
            <button class="header-button">
              <img src="craft-images/login.svg" alt="icon for signup" />
              <a href="./signup.index.html">
                <h3 class="h3-button">Sign Up</h3>
              </a>
            </button>
          </div>
          <!-- Community -->
          <div>
            <button class="header-button">
              <img src="craft-images/community.svg" alt="icon for community" />
              <a href="./community-index.html">
                <h3 class="h3-button">Community</h3>
              </a>
            </button>
          </div>
          <!-- Feedback -->
          <div>
            <button class="header-button">
              <img src="craft-images/feedback.svg" alt="icon for feedback" />
              <a href="./feedback-index.html">
                <h3 class="h3-button">Feedback</h3>
              </a>
            </button>
          </div>
        </section>
      </section>
    </header>
    <main>
      <!-- Feedback Form -->
      <section class="feedback-form">
        <form action="">
          <!-- Form Title & Text -->
          <section class="form-head">
            <h2 class="form-title h2-orange">We'd love to hear from you!</h2>
            <p class="p-form">
              With your feedback CRAFTSVILLA can become a better place for
              everyone! Please share your thoughts with us by filling out the
              form below.
            </p>
          </section>
          <!-- Form Content -->
          <section class="feedback-container">
            <!-- Name -->
            <div class="form-div">
              <label for="text">Name / Username</label>
              <input type="text" id="text" placeholder="Text here..." />
            </div>
            <!-- Email -->
            <div class="form-div">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="Text here..." />
            </div>
            <!-- Phone -->
            <div class="form-div">
              <label for="tel">Phone Number</label>
              <input type="tel" id="tel" placeholder="1234..." />
            </div>
            <!-- Textarea 1 -->
            <div class="form-div textarea-box">
              <label for="message">What do you like about CRAFTSVILLA?</label>
              <textarea
                type="message"
                id="message"
                placeholder="Text here..."
              ></textarea>
            </div>
            <!-- Textarea 2 -->
            <div class="form-div textarea-box">
              <label for="message">How can CRAFTSVILLA improve?</label>
              <textarea
                type="message"
                id="message"
                placeholder="Text here..."
              ></textarea>
            </div>
            <!-- Choices -->
            <div class="form-div choice-box">
              <label for="message"
                >Would you recommend CRAFTSVILLA to someone?</label
              >
              <label class="choice-label">
                <input type="radio" name="answer" /> Yes
              </label>
              <label class="choice-label">
                <input type="radio" name="answer" /> No
              </label>
              <label class="choice-label">
                <input type="radio" name="answer" /> Maybe
              </label>
            </div>
          </section>
          <!-- Permission -->
          <section class="feedback-container form-div">
<h3 class="h3-orange"> Permission</h3>
            <div class="permission-box">
              <label class="terms-label">
                I accept that CRAFTSVILLA's terms and conditions.</label
              >
              <input type="checkbox" id="checkbox" />
            </div>
             </section>
         



          
        </form>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <section class="footer footer-text">
        <div><h4>About Us</h4></div>
        <div><h4>Projects</h4></div>
        <div><h4>Contact Us</h4></div>
        <div><h4>Terms & Conditions</h4></div>
      </section>
    </footer>
  </body>
</html>
