<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="dashboard-script.js" defer></script>
    <link rel="stylesheet" href="dashboard-style.css" />
    <title>Personal Data Dashboard</title>
  </head>
  <body>
    <!-- HEADER -->
    <header id="headings">
      <h1>Welcome to the Bookworm Library</h1>
      <hr />
      <h2>Explore our catalog today - it contains over 10,000 books!</h2>
    </header>
    <!-- MAIN -->
    <main>
      <form id="book-form">
        <!-- BOOK INPUT -->
        <div class="book-search" id="book-search">
          <label for="book-input"> <h3>Enter bookID:</h3></label>
          <input type="text" id="book-input" placeholder="Example: ac1939..." />
          <div id="buttons">
            <!-- BUTTONS -->
            <div class="book-toggle" id="book-toggle"></div>
            <button type="submit" id="submit-button">Find book</button>
            <button type="button" class="fav-button" id="add-book">
              Add to Favourites
            </button>
            <button type="button" id="sort-button">Sort A-Z</button>
            <!-- FILTER BY AUTHOR -->
            <div id="filter-search">
              <h3>Filter books by author:</h3>
              <input
                type="text"
                id="filter-input"
                placeholder="Example: Dan Brown..."
              />
              <button type="button" id="filter-button">
                Filter books by author
              </button>
              <div id="book-results"></div>
            </div>
            <!-- FAVOURITES LIST -->
            <div class="fav-title">
              <h2>My Favourite Books</h2>
            </div>
            <div id="favourites-list"></div>
            <button type="button" id="remove-button">Remove book</button>
          </div>
        </div>
      </form>
      <!-- CHEATSHEET  -->
      <section class="cheatsheet">
        <h3>BookIDs currently available:</h3>
        <div class="ids">
          <p>ac1939</p>
          <p>db2009</p>
          <p>hp1883</p>
          <p>ad1846</p>
          <p>uk2022</p>
        </div>
      </section>
    </main>
  </body>
</html>
