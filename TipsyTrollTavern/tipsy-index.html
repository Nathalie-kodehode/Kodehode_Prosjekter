<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="tipsy-style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amarante&family=Metamorphous&display=swap"
      rel="stylesheet"
    />
<link rel="icon" href="tipsy-images/tipsy-favicon.svg">
    <title>Tipsy Troll Tavern</title>
  </head>
  <body>
    <!-- HEADER -->
    <header>
      <div class="tavern-name">
         <img src="tipsy-images/tipsy-favicon.svg" alt="icon for tipsy troll tavern" width="20" height="20">
        <p>Tipsy Troll Tavern</p>
      </div>
      <div class="navbar">
        <p>Our Menu</p>
      </div>
      <div class="navbar">
        <p>Book a Table</p>
      </div>
      <div class="navbar">
        <p>Log In</p>
      </div>
    </header>
    <!-- MAIN -->
    <main>
      <!-- Hero -->
      <section class="section-hero">
        <div class="hero-title">
          <h1>Welcome to Tipsy Troll Tavern</h1>
        </div>
        <div class="hero-image">
          <img src="tipsy-images/Skjermbilde 2026-10-02 111539.png" alt="hero image">
        </div>
      </section>
      <!-- Daily Special -->
      <section class="section-special">
        <section class="special-image"></section>
        <section class="special-menu">
          <div class="special-title">
            <h2>Daily Special</h2>
          </div>
          <div class="special-desc">
            <h4>Short desc about daily special</h4>
          </div>
        </section>
      </section>
      <!-- About Us -->
      <section class="section-about">
        <section>
          <img
            src="tipsy-images/left-img.png"
            alt="left image"
            class="left-img"
          />
        </section>
        <section class="about-us">
          <div class="about-title">
            <h2>About Us</h2>
          </div>
          <div class="about-text">
            <h4>this is about us desc</h4>
          </div>
        </section>
        <section>
          <img
            src="tipsy-images/right-img.png"
            alt="right image"
            class="right-img"
          />
        </section>
      </section>
      <!-- Message Form -->
      <section class="section-message">
        <section class="form-section">
          <!-- Message Form title -->
          <div class="form-title">
            <h2>Message Form</h2>
          </div>
          <form class="message-form">
            <!-- Name -->
            <div class="name-email">
              <label for="name"> Name</label>
              <input type="text" name="name" id="name" />
            </div>
            <!-- Email -->
            <div class="name-email">
              <label for="email"> Email</label>
              <input type="email" name="email" id="email" />
            </div>
          </form>
        </section>
        <!-- Textarea-->
        <section class="message-button">
          <div>
            <form>
              <label for="message">Enter your message</label>
              <textarea
                type="message"
                id="message"
                placeholder="Text here..."
              ></textarea>
            </form>
          </div>
          <!-- Button -->
          <div>
            <button class="send-button">Send message</button>
          </div>
        </section>
      </section>
    </main>
    <!-- FOOTER -->
    <footer>
      <div class="footer-bar">
        <p>@TipsyTrollTavern, 2026</p>
      </div>
      <div class="footer-bar">
        <p>Follow Us on Medieval Media</p>
      </div>
      <div class="footer-bar">
        <p>Terms & Conditions</p>
      </div>
    </footer>
  </body>
</html>
