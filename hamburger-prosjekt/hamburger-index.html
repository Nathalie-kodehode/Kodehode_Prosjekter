<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="hamburger-style.css" />
    <script src="hamburger-script.js" defer></script>
    <title>Hamburger Project</title>
  </head>
  <body>
    <!-- Navbar -->
    <header>
      <div class="head-buttons" id="head-buttons">
        <!-- Hamburger Menu -->
        <div class="menu-container" id="menu-container">
          <button
            class="menu-button"
            id="menu-button"
            aria-expanded="false"
            aria-controls="burger-menu"
          >
            <img
              id="menu-icon"
              src="hamburger-images/hamburger.svg"
              alt="hamburger meny"
            />
            <h3>Burger Menu</h3>
          </button>
          <!-- The Menu Items -->
          <ul class="burger-menu" id="burger-menu">
            <li><a href="#burger-1">Greasy Rat Burger</a></li>
            <li><a href="#burger-2">Grandma's Ashes Burger</a></li>
            <li><a href="#burger-3">Poison Cheeseburger</a></li>
            <li><a href="#burger-4">Triple Poison Cheeseburger XXL</a></li>
            <li><a href="#burger-5">Reaper's 100 Jalapeno Burger</a></li>
            <li><a href="#burger-6">Explosive Diarrea Burger</a></li>
            <li><a href="#burger-7">Moldy Surprise Fishburger</a></li>
            <li>
              <a href="#burger-8">Human Meat Burger (we promise it's good)</a>
            </li>
          </ul>
        </div>
        <!-- The 4 Other Buttons -->
        <button>
          <img src="hamburger-images/profile.svg" alt="profile icon" />
          <h3>My Account</h3>
        </button>
        <button>
          <img src="hamburger-images/shopping.svg" alt="shopping cart icon" />
          <h3>Shopping Cart</h3>
        </button>
        <button>
          <img src="hamburger-images/contact.svg" alt="contact us icon" />
          <h3>Contact Us</h3>
        </button>
        <button>
          <img src="hamburger-images/donate.svg" alt="donation icon" />
          <h3>Donate Here</h3>
        </button>
      </div>
    </header>
    <!-- Hero Image -->
    <main>
      <div class="hero-image" id="hero-image">
        <h1>Heading</h1>
        <h2>Subheading</h2>
      </div>
    </main>
  </body>
</html>
